<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neem contact op | BuurthulpDeventer</title>
  <meta name="description" content="Neem contact op met BuurthulpDeventer.">
  <style>
    :root {
      --green: #28ad97;
      --yellow: #fff69a;
      --cream: #fff9d8;
      --black: #050505;
      --white: #ffffff;
      --title-size: clamp(4rem, 8.1vw, 5.4rem);
      --text-size: 24px;
      --button-width: min(70vw, 520px);
      --button-height: 128px;
      --button-radius: 68px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--green);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--black);
      background: var(--green);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 36px 56px 48px;
      overflow-x: hidden;
    }

    .menu-button {
      width: 64px;
      height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-button span {
      display: block;
      width: 64px;
      height: 4px;
      background: var(--black);
      border-radius: 3px;
    }

    .site-header {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .menu-wrap {
      position: relative;
      width: max-content;
      margin-top: 20px;
      line-height: 0;
      z-index: 10;
    }

    .menu-panel {
      position: absolute;
      top: 70px;
      left: 0;
      width: min(78vw, 340px);
      display: grid;
      gap: 12px;
      padding: 20px;
      border-radius: 26px;
      background: var(--yellow);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .menu-panel.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .menu-panel a {
      color: var(--black);
      text-decoration: none;
      font-size: var(--text-size);
      line-height: 1.2;
      padding: 10px 6px;
    }

    .menu-panel a:hover,
    .menu-panel a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .hero {
      margin-top: 0;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--yellow);
      font-size: var(--title-size);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: 0;
    }

    .title-line {
      width: 100%;
      height: 3px;
      margin: 8px 0 0;
      background: var(--yellow);
    }

    .intro {
      width: min(87vw, 793px);
      margin: 90px 0 76px;
      color: var(--cream);
      font-size: var(--text-size);
      line-height: 1.16;
      font-weight: 400;
    }

    .contact-card {
      width: min(96vw, 890px);
      margin: 0 auto 54px;
      padding: 34px 32px 42px;
      border-radius: 78px 78px 26px 26px;
      background: var(--yellow);
    }

    .contact-card h2 {
      margin: 0 0 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--text-size);
      font-weight: 400;
      line-height: 1;
    }

    form {
      display: grid;
      gap: 22px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: var(--text-size);
      line-height: 1.2;
    }

    input,
    textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.55);
      border-radius: 0;
      padding: 10px 4px 9px;
      background: transparent;
      color: var(--black);
      font: inherit;
      font-size: var(--text-size);
      outline: none;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-bottom-color: var(--black);
      box-shadow: 0 2px 0 var(--black);
    }

    .submit {
      width: min(100%, 260px);
      min-height: 58px;
      margin-top: 10px;
      border: 2px solid var(--black);
      border-radius: 32px;
      background: transparent;
      color: var(--black);
      font: inherit;
      font-size: var(--text-size);
      cursor: pointer;
    }

    .direct-contact {
      width: min(87vw, 793px);
      margin: 0 auto 36px;
      color: var(--cream);
      font-size: var(--text-size);
      line-height: 1.25;
    }

    .direct-contact a {
      color: var(--cream);
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    .home-link {
      width: var(--button-width);
      min-height: var(--button-height);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-radius: var(--button-radius);
      background: var(--yellow);
      color: var(--black);
      text-decoration: none;
      font-size: var(--text-size);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding-top: 20px;
    }

    .socials a {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      text-decoration: none;
    }

    .socials svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 760px) {
      .page {
        padding: 36px 28px 36px;
      }

      .menu-button,
      .menu-button span {
        width: 48px;
      }

      .menu-button {
        height: 38px;
      }

      .menu-button span {
        height: 3px;
      }

      .menu-panel {
        top: 56px;
      }

      .menu-wrap {
        margin-top: 14px;
      }

      .site-header {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 16px;
      }

      h1 {
        font-size: var(--title-size);
      }

      .title-line,
      .intro,
      .direct-contact {
        width: 100%;
      }

      .intro {
        margin: 64px 0 52px;
      }

      .contact-card {
        width: 100%;
        border-radius: 52px 52px 20px 20px;
        padding: 28px 24px 34px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .home-link {
        width: var(--button-width);
        min-height: var(--button-height);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <div class="menu-wrap">
        <button class="menu-button" type="button" aria-label="Menu" aria-controls="site-menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="menu-panel" id="site-menu" aria-label="Menu" hidden>
          <a href="index.html">Home</a>
          <a href="wie-zijn-wij.html">Wie zijn wij?</a>
          <a href="wat-doen-wij.html">Wat doen wij?</a>
          <a href="contact.html">Neem contact op</a>
        </nav>
      </div>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Neem contact op</h1>
        <div class="title-line" aria-hidden="true"></div>
      </section>
    </header>

    <p class="intro">Als u uw gegevens achterlaat, nemen wij zo snel mogelijk contact met u op.</p>

    <section class="contact-card" aria-labelledby="contact-title">
      <h2 id="contact-title">Contactgegevens</h2>
      <form id="contact-form" method="post" enctype="text/plain">
        <div class="row">
          <label>Voornaam *
            <input type="text" name="Voornaam" autocomplete="given-name" required>
          </label>
          <label>Achternaam *
            <input type="text" name="Achternaam" autocomplete="family-name" required>
          </label>
        </div>

        <div class="row">
          <label>E-mailadres *
            <input type="email" name="E-mailadres" autocomplete="email" required>
          </label>
          <label>Adres
            <input type="text" name="Adres" autocomplete="street-address">
          </label>
        </div>

        <label>Telefoonnummer *
          <input type="tel" name="Telefoonnummer" autocomplete="tel" required>
        </label>

        <label>Hoe lang denkt u dat wij met de klus bezig zijn?
          <input type="text" name="Tijdsinschatting">
        </label>

        <label>Leg zo kort mogelijk uit waarbij u hulp nodig heeft *
          <textarea name="Hulpvraag" required></textarea>
        </label>

        <button class="submit" type="submit">Versturen</button>
      </form>

      <p id="form-status"></p>
    </section>

    <p class="direct-contact">
      U kunt ons ook mailen via: <a href="mailto:buurthulpdeventer@gmail.com">buurthulpdeventer@gmail.com</a> of bellen via: <a href="tel:0570-756230">(0570)-756230</a>
    </p>

    <a class="home-link" href="index.html">
      <span>Home</span>
      <span aria-hidden="true">→</span>
    </a>

    <footer class="socials" aria-label="Social media">
      <a href="https://www.facebook.com/profile.php?id=61590582818465" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#1877f2" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.513c-1.49 0-1.956.931-1.956 1.887v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          <path fill="#fff" d="m16.671 15.563.532-3.49h-3.328V9.808c0-.956.466-1.887 1.956-1.887h1.513v-2.97s-1.374-.235-2.686-.235c-2.741 0-4.533 1.672-4.533 4.697v2.66H7.078v3.49h3.047V24a12.13 12.13 0 0 0 3.75 0v-8.437h2.796z"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/buurthulpdeventer/" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="instagram-gradient-contact" cx="30%" cy="107%" r="150%">
              <stop offset="0" stop-color="#fdf497"/>
              <stop offset="0.05" stop-color="#fdf497"/>
              <stop offset="0.45" stop-color="#fd5949"/>
              <stop offset="0.6" stop-color="#d6249f"/>
              <stop offset="0.9" stop-color="#285aeb"/>
            </radialGradient>
          </defs>
          <rect width="24" height="24" rx="6" fill="url(#instagram-gradient-contact)"/>
          <path fill="#fff" d="M12 7.35A4.65 4.65 0 1 0 12 16.65 4.65 4.65 0 0 0 12 7.35zm0 7.68A3.03 3.03 0 1 1 12 8.97a3.03 3.03 0 0 1 0 6.06zm5.91-7.86a1.08 1.08 0 1 1-2.16 0 1.08 1.08 0 0 1 2.16 0z"/>

        </svg>
      </a>
    </footer>
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const menuPanel = document.querySelector('.menu-panel');

    function closeMenu() {
      menuPanel.classList.remove('is-open');
      menuPanel.hidden = true;
      menuButton.setAttribute('aria-expanded', 'false');
    }

    menuButton.addEventListener('click', () => {
      const isOpen = menuButton.getAttribute('aria-expanded') === 'true';

      if (isOpen) {
        closeMenu();
        return;
      }

      menuPanel.hidden = false;
      menuPanel.classList.add('is-open');
      menuButton.setAttribute('aria-expanded', 'true');
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu();
        menuButton.focus();
      }
    });

    const ENDPOINT = "https://script.google.com/macros/s/AKfycbzLetFPk4H_UTrdnGXZmWC33F5iJC-XqnrnDPLnC9eMkOETt0PCuG-cwQo4xRvW2NYUSA/exec";
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
  
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Sending…";
  
      const res = await fetch(ENDPOINT, {
        method: "POST",
        // text/plain avoids the CORS preflight Apps Script can't answer
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          tab: "contact",
          fields: Object.fromEntries(new FormData(form)),
        }),
      });
  
      const data = await res.json();
      status.textContent =
        data.result === "success" ? "Thanks — we'll be in touch." : "Something went wrong.";
      if (data.result === "success") form.reset();
    });
  </script>
</body>  
</html>
