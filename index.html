<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | BuurthulpDeventer</title>
  <meta name="description" content="BuurthulpDeventer - buurtgenoten helpen elkaar in Deventer.">
  <style>
    :root {
      --green: #28ad97;
      --yellow: #fff69a;
      --black: #050505;
      --white: #ffffff;
      --title-size: clamp(4rem, 8.1vw, 5.4rem);
      --text-size: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--green);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--black);
      background: var(--green);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 36px 56px 42px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .menu-button {
      width: 64px;
      height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-button span {
      display: block;
      width: 64px;
      height: 4px;
      background: var(--black);
      border-radius: 3px;
    }

    .site-header {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .menu-wrap {
      position: relative;
      width: max-content;
      margin-top: 20px;
      line-height: 0;
      z-index: 10;
    }

    .menu-panel {
      position: absolute;
      top: 70px;
      left: 0;
      width: min(78vw, 340px);
      display: grid;
      gap: 12px;
      padding: 20px;
      border-radius: 26px;
      background: var(--yellow);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .menu-panel.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .menu-panel a {
      color: var(--black);
      text-decoration: none;
      font-size: 24px;
      line-height: 1.2;
      padding: 10px 6px;
    }

    .menu-panel a:hover,
    .menu-panel a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .hero {
      margin-top: 0;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--yellow);
      font-size: var(--title-size);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .title-line {
      width: 100%;
      height: 3px;
      margin: 4px 0 0;
      background: var(--yellow);
    }

    .home-layout {
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(360px, 1fr);
      gap: clamp(42px, 7vw, 98px);
      align-items: center;
      margin-top: 16px;
      padding-left: 68px;
    }

    .tiles {
      width: 100%;
      margin: 0;
      display: grid;
      gap: 15px;
    }

    .tile {
      min-height: 126px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 44px;
      background: var(--yellow);
      color: var(--black);
      text-decoration: none;
      font-size: var(--text-size);
      font-weight: 400;
      letter-spacing: 0;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.12);
      outline: none;
    }

    .tile .arrow {
      font-size: 1em;
      line-height: 1;
      transform: translateY(-2px);
    }

    .home-image {
      width: min(100%, 690px);
      display: block;
      justify-self: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 18px;
    }

    .socials a {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      text-decoration: none;
    }

    .socials svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 760px) {
      .page {
        padding: 32px 22px 34px;
      }

      .menu-button,
      .menu-button span {
        width: 48px;
      }

      .menu-button {
        height: 38px;
      }

      .menu-button span {
        height: 3px;
      }

      .menu-panel {
        top: 56px;
      }

      .menu-wrap {
        margin-top: 14px;
      }

      .site-header {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 16px;
      }

      .hero {
        margin-top: 0;
      }

      h1 {
        font-size: var(--title-size);
        white-space: normal;
      }

      .title-line {
        width: 100%;
        margin-top: 8px;
        margin-left: 0;
      }

      .home-layout {
        grid-template-columns: 1fr;
        gap: 34px;
        margin-top: 28px;
        padding-left: 0;
      }

      .tiles {
        width: 100%;
        gap: 22px;
      }

      .tile {
        min-height: 118px;
        border-radius: 44px;
        padding: 28px;
        text-align: center;
      }
    }

    @media (max-width: 430px) {
      .page {
        min-height: 100vh;
        padding-inline: 20px;
      }

      .tile {
        min-height: 104px;
        border-radius: 38px;
      }
    }
  </style>
</head>
<body>

  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const menuPanel = document.querySelector('.menu-panel');

    function closeMenu() {
      menuPanel.classList.remove('is-open');
      menuPanel.hidden = true;
      menuButton.setAttribute('aria-expanded', 'false');
    }

    menuButton.addEventListener('click', () => {
      const isOpen = menuButton.getAttribute('aria-expanded') === 'true';

      if (isOpen) {
        closeMenu();
        return;
      }

      menuPanel.hidden = false;
      menuPanel.classList.add('is-open');
      menuButton.setAttribute('aria-expanded', 'true');
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu();
        menuButton.focus();
      }
    });
  </script>
</body>
